[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kit_estadistica"
version = "0.1.0"
description = "Un paquete de python para la discretización, normalización, métricas, correlación, y visualización."
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0"
]
